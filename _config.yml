# Site settings
title: Donghwan KIM
description: "Chemistry undergraduate at NUS working on machine-learned interatomic potentials and magnetism in computational chemistry."
lang: en
author: Donghwan KIM
email: e1075536@u.nus.edu
url: "https://dhwan0112.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Permalink settings
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  pages:
    output: true
    permalink: /:path/
  notes:
    output: true
    permalink: /notes/:path/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "post"
      lang: "ko"
  - scope:
      path: "fortran"
    values:
      layout: "fortran"

# Exclude files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - CONTENT_GUIDE.md
  - BLOG_GUIDE.md
  - templates/
  - examples/
  - tools/
  - docs/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
