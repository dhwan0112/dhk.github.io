<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'IBM Plex Sans', sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#718096" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="860" height="440" fill="#ffffff"/>

  <!-- Title -->
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">Cu 표면 흡착 시뮬레이션 셀 (슬랩 기하)</text>
  <text x="430" y="47" text-anchor="middle" font-size="11" fill="#718096">boundary p p f · 30 × 30 × 41.895 Å³ · 단면도 (x–z)</text>

  <!-- z axis -->
  <line x1="120" y1="392" x2="120" y2="70" stroke="#4a5568" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="112" y="64" text-anchor="end" font-size="12" font-weight="600" fill="#4a5568">z</text>
  <text x="112" y="396" text-anchor="end" font-size="10" fill="#718096">0</text>
  <text x="112" y="160" text-anchor="end" font-size="10" fill="#718096" transform="rotate(-90 112 160)">z: 비주기 (f)</text>

  <!-- Simulation cell cross-section -->
  <rect x="150" y="70" width="190" height="320" fill="none" stroke="#4a5568" stroke-width="1.5"/>

  <!-- top wall (wall/lj93 zhi) -->
  <rect x="150" y="72" width="190" height="9" fill="url(#hatch)" stroke="#718096" stroke-width="0.8"/>

  <!-- organic + vacuum region -->
  <rect x="151" y="81" width="188" height="214" fill="#f4f7fb"/>
  <!-- benzene hexagons -->
  <g stroke="#3b6ea5" stroke-width="1.6" fill="#dce8f3">
    <polygon points="195,130 207,123 219,130 219,144 207,151 195,144"/>
    <polygon points="262,170 274,163 286,170 286,184 274,191 262,184"/>
    <polygon points="210,232 222,225 234,232 234,246 222,253 210,246"/>
  </g>
  <!-- ethanol (O-H + chain) glyphs -->
  <g>
    <g><circle cx="285" cy="120" r="6" fill="#6b8fb5"/><circle cx="296" cy="114" r="3.5" fill="#cbd5e0"/><line x1="285" y1="120" x2="272" y2="128" stroke="#4a5568" stroke-width="2.2"/></g>
    <g><circle cx="180" cy="185" r="6" fill="#6b8fb5"/><circle cx="191" cy="179" r="3.5" fill="#cbd5e0"/><line x1="180" y1="185" x2="167" y2="193" stroke="#4a5568" stroke-width="2.2"/></g>
    <g><circle cx="290" cy="250" r="6" fill="#6b8fb5"/><circle cx="301" cy="244" r="3.5" fill="#cbd5e0"/><line x1="290" y1="250" x2="277" y2="258" stroke="#4a5568" stroke-width="2.2"/></g>
  </g>

  <!-- Cu slab -->
  <rect x="151" y="295" width="188" height="94" fill="#ead9c7"/>
  <g stroke="#a9744f" stroke-width="1">
    <line x1="151" y1="312" x2="339" y2="312"/>
    <line x1="151" y1="330" x2="339" y2="330"/>
    <line x1="151" y1="348" x2="339" y2="348"/>
    <line x1="151" y1="366" x2="339" y2="366"/>
  </g>
  <g fill="#a9744f">
    <circle cx="170" cy="312" r="3"/><circle cx="206" cy="312" r="3"/><circle cx="242" cy="312" r="3"/><circle cx="278" cy="312" r="3"/><circle cx="314" cy="312" r="3"/>
    <circle cx="188" cy="330" r="3"/><circle cx="224" cy="330" r="3"/><circle cx="260" cy="330" r="3"/><circle cx="296" cy="330" r="3"/>
    <circle cx="170" cy="348" r="3"/><circle cx="206" cy="348" r="3"/><circle cx="242" cy="348" r="3"/><circle cx="278" cy="348" r="3"/><circle cx="314" cy="348" r="3"/>
  </g>

  <!-- in-cell labels -->
  <text x="245" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3748">벤젠 · 에탄올</text>
  <text x="245" y="206" text-anchor="middle" font-size="10" fill="#718096">(혼합 흡착층 + 진공)</text>
  <text x="245" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a37">Cu(100)/(111) 슬랩</text>

  <!-- x periodic arrow -->
  <line x1="150" y1="410" x2="340" y2="410" stroke="#4a5568" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="245" y="426" text-anchor="middle" font-size="10" fill="#718096">x · y: 주기 경계 (p),  30 Å</text>

  <!-- Right callout panel -->
  <g font-size="12.5" fill="#1a202c">
    <text x="410" y="92" font-size="13" font-weight="700" fill="#2d3748">셀 구성 요약</text>

    <rect x="410" y="104" width="14" height="14" rx="3" fill="url(#hatch)" stroke="#718096" stroke-width="0.6"/>
    <text x="434" y="115" font-weight="600">상부 벽  <tspan font-family="'IBM Plex Mono',monospace" font-weight="400" fill="#4a5568">fix wall/lj93 zhi</tspan></text>
    <text x="434" y="132" font-size="11" fill="#718096">분자가 진공으로 빠져나가지 않도록 z 상단을 막는다.</text>

    <rect x="410" y="148" width="14" height="14" rx="3" fill="#dce8f3" stroke="#3b6ea5" stroke-width="1"/>
    <text x="434" y="159" font-weight="600">흡착질  벤젠(π) + 에탄올(−OH)</text>
    <text x="434" y="176" font-size="11" fill="#718096">진공-액체 영역에 무작위 배치, 표면 점유 경쟁.</text>

    <rect x="410" y="192" width="14" height="14" rx="3" fill="#ead9c7" stroke="#a9744f" stroke-width="1"/>
    <text x="434" y="203" font-weight="600">Cu 슬랩  fcc a = 3.615 Å</text>
    <text x="434" y="220" font-size="11" fill="#718096">z 하단 배치, 가열·평형 단계에서 <tspan font-family="'IBM Plex Mono',monospace" fill="#4a5568">setforce 0</tspan> 로 고정.</text>

    <rect x="410" y="236" width="14" height="14" rx="3" fill="#cbd5e0" stroke="#4a5568" stroke-width="0.8"/>
    <text x="434" y="247" font-weight="600">경계  x,y 주기 (p) · z 비주기 (f)</text>
    <text x="434" y="264" font-size="11" fill="#718096">표면 흡착의 표준 슬랩 설정 — 슬랩 위에 진공을 둔다.</text>

    <rect x="410" y="280" width="14" height="14" rx="3" fill="#eef3f8" stroke="#3b6ea5" stroke-width="0.9"/>
    <text x="434" y="291" font-weight="600">정전기  PPPM (슬랩 보정) 또는 MSM</text>
    <text x="434" y="308" font-size="11" fill="#718096">에탄올 −O−H 부분 전하의 장거리 상호작용 처리.</text>
  </g>

  <!-- note divider -->
  <line x1="410" y1="332" x2="828" y2="332" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="354" font-size="11" fill="#718096">왼쪽 단면도는 본 시스템의 모식도이며, 실제 Cu(100) 슬랩의</text>
  <text x="410" y="370" font-size="11" fill="#718096">원자 배열·z 밀도 프로파일은 아래 실측 그림에서 확인할 수 있다.</text>
</svg>
