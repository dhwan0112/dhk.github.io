<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'IBM Plex Sans', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="880" height="360" fill="#ffffff"/>

  <!-- Section boxes -->
  <!-- Box 1: Initialization -->
  <g>
    <rect x="20"  y="80" width="190" height="170" rx="10" ry="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="115" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2b6cb0">STEP 1</text>
    <text x="115" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Initialization</text>
    <text x="115" y="124" text-anchor="middle" font-size="11" fill="#4a5568">박스 만들기 전 설정</text>
    <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1a202c">
      <text x="35" y="155">units</text>
      <text x="35" y="172">dimension</text>
      <text x="35" y="189">boundary</text>
      <text x="35" y="206">atom_style</text>
      <text x="35" y="223">pair_style</text>
      <text x="35" y="240">bond_style</text>
    </g>
  </g>

  <!-- Box 2: System Definition -->
  <g>
    <rect x="230" y="80" width="190" height="170" rx="10" ry="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
    <text x="325" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#2f855a">STEP 2</text>
    <text x="325" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">System Definition</text>
    <text x="325" y="124" text-anchor="middle" font-size="11" fill="#4a5568">박스와 원자 만들기</text>
    <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1a202c">
      <text x="245" y="155">lattice</text>
      <text x="245" y="172">region</text>
      <text x="245" y="189">create_box</text>
      <text x="245" y="206">create_atoms</text>
      <text x="245" y="223">read_data</text>
      <text x="245" y="240">read_restart</text>
    </g>
  </g>

  <!-- Box 3: Simulation Settings -->
  <g>
    <rect x="440" y="80" width="200" height="170" rx="10" ry="10" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
    <text x="540" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#c05621">STEP 3</text>
    <text x="540" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Simulation Settings</text>
    <text x="540" y="124" text-anchor="middle" font-size="11" fill="#4a5568">힘장 계수 · fix · 출력</text>
    <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1a202c">
      <text x="455" y="155">pair_coeff</text>
      <text x="455" y="172">kspace_style</text>
      <text x="455" y="189">velocity</text>
      <text x="455" y="206">timestep</text>
      <text x="455" y="223">fix · compute</text>
      <text x="455" y="240">thermo · dump</text>
    </g>
  </g>

  <!-- Box 4: Run -->
  <g>
    <rect x="660" y="80" width="200" height="170" rx="10" ry="10" fill="#fff5f5" stroke="#9b2c2c" stroke-width="2"/>
    <text x="760" y="68" text-anchor="middle" font-size="13" font-weight="700" fill="#9b2c2c">STEP 4</text>
    <text x="760" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1a202c">Run a Simulation</text>
    <text x="760" y="124" text-anchor="middle" font-size="11" fill="#4a5568">실제 적분 / 최소화 실행</text>
    <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#1a202c">
      <text x="675" y="160">minimize</text>
      <text x="675" y="180">run</text>
      <text x="675" y="200">rerun</text>
      <text x="675" y="220">temper</text>
    </g>
  </g>

  <!-- Forward arrows -->
  <line x1="210" y1="165" x2="230" y2="165" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="165" x2="440" y2="165" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="165" x2="660" y2="165" stroke="#2b6cb0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop arrow (STEP 4 -> STEP 3 — manual notes "마지막 두 부분은 반복 가능") -->
  <path d="M 760 250 Q 760 310 540 310 Q 540 280 540 260"
        fill="none" stroke="#c05621" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-loop)"/>
  <text x="650" y="332" text-anchor="middle" font-size="11" fill="#c05621" font-style="italic">
    "마지막 두 부분(Settings · Run)은 원하는 만큼 반복할 수 있다" — LAMMPS Manual
  </text>

  <!-- Title -->
  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1a202c">
    LAMMPS 입력 스크립트의 4단계 표준 구조
  </text>
  <text x="440" y="48" text-anchor="middle" font-size="11" fill="#718096">
    공식 매뉴얼 — Commands_structure.html
  </text>
</svg>
