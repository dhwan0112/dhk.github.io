# Subject homes for the Notes collection.
# A note belongs to a topic when its `note` front matter starts with the topic code.
- key: Math
  slug: math
  name: Math
  ko: 수학
  lede: "고등학교 함수와 다항식에서 미적분 입문까지, 정의와 증명을 중심으로 쓴 개념 노트."
  chapters:
    - code: "11"
      name: 미적분
      en: Calculus
      topics:
        - code: "11-10"
          name: 극한
          blurb: "극한의 엄밀한 정의와, 그 정의 위에서 증명하는 로피탈 정리."
        - code: "11-20"
          name: 그래프 개형
          blurb: "대수적 특성만으로 다항함수와 유리함수의 개형을 그리는 절차."
        - code: "11-30"
          name: 복소적분
          blurb: "유수 정리로 실축 위 이상적분을 닫힌 경로 적분으로 바꿔 계산하는 방법과, 반원 호 적분이 0으로 가는 조건."
    - code: "12"
      name: 대수
      en: Algebra
      topics:
        - code: "12-10"
          name: 함수
          blurb: "그래프의 평행이동·확대와 역함수의 구조."
        - code: "12-20"
          name: 다항식
          blurb: "다항식 나눗셈과 다항식의 값을 계산하는 알고리즘."

- key: Earth Science
  slug: earth-science
  name: Earth Science
  ko: 지구과학
  lede: "천체 관측에서 보이는 현상을 단순한 궤도 모형으로 계산한 노트."
  chapters:
    - code: "21"
      name: 천문
      en: Astronomy
      topics:
        - code: "21-10"
          name: 행성 운동
          blurb: "외행성의 역행과 회합 주기."

- key: Chemistry
  slug: chemistry
  name: Chemistry
  ko: 화학
  lede: "교과서 실험과 분포를 직접 시뮬레이션해 보고, 해석식과 수치로 맞춰 본 화학 노트."
  chapters:
    - code: "31"
      name: 물리화학
      en: Physical Chemistry
      topics:
        - code: "31-10"
          name: 원자 구조
          blurb: "러더퍼드 산란을 건포도 푸딩 모형의 예측과 핵 모형의 관측으로 나눠 비교."
        - code: "31-20"
          name: 기체 분자 운동론
          blurb: "같은 속력에서 출발한 기체가 충돌로 맥스웰-볼츠만 분포에 도달하는 과정과 입자 수에 따른 수렴."
