---
layout: default
---

<article class="note-entry">
    <section class="research-header">
        <div class="container">
            <h1 class="page-title">{{ page.title }}</h1>
            <div class="note-meta">
                <span class="note-date">{{ page.date | date: "%Y-%m-%d" }}</span>
                {% if page.category %}
                <span class="note-category">{{ page.category }}</span>
                {% endif %}
            </div>
        </div>
    </section>

    <section class="lab-notes">
        <div class="container">
            <div class="note-content">
                {{ content }}

                {% if page.attachments %}
                <div class="note-attachments">
                    <h4>Attachments:</h4>
                    <div class="attachment-list">
                        {% for att in page.attachments %}
                        <span class="attachment-item">
                            {{ att.name }}
                        </span>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </section>

    <section class="post-navigation">
        <div class="container">
            <a href="{{ '/research-notes' | relative_url }}" class="btn btn-secondary">
                Back to lab notes
            </a>
        </div>
    </section>
</article>
