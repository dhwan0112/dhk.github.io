<aside class="sidebar">
    <a href="{{ '/' | relative_url }}" class="sidebar-header">
        <img src="{{ '/images/avatar.png' | relative_url }}" alt="" class="sidebar-avatar" width="44" height="44">
        <span>
            <span class="sidebar-name">Donghwan KIM</span>
            <span class="sidebar-subtitle">Chemistry, NUS</span>
        </span>
    </a>

    <nav class="sidebar-nav">
        <a href="{{ '/research/' | relative_url }}" class="sidebar-link {% if page.url == '/research/' %}active{% endif %}">Research</a>
        <a href="{{ '/blog/' | relative_url }}" class="sidebar-link {% if page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog</a>
        <a href="{{ '/guides/' | relative_url }}" class="sidebar-link {% if page.url == '/guides/' %}active{% endif %}">Guides</a>
        <div class="sidebar-sub">
            <a href="{{ '/guides/orca/' | relative_url }}" class="sidebar-link">ORCA</a>
            <a href="{{ '/guides/lammps/' | relative_url }}" class="sidebar-link">LAMMPS</a>
            <a href="{{ '/guides/qe/' | relative_url }}" class="sidebar-link">Quantum ESPRESSO</a>
        </div>
        <a href="{{ '/teaching/' | relative_url }}" class="sidebar-link {% if page.url == '/teaching/' %}active{% endif %}">Teaching</a>
        <a href="{{ '/education/' | relative_url }}" class="sidebar-link {% if page.url == '/education/' %}active{% endif %}">Education</a>
        <a href="{{ '/' | relative_url }}#contact" class="sidebar-link">Contact</a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-social">
            <a href="https://github.com/dhwan0112" target="_blank" rel="noopener">GitHub</a>
            <a href="https://www.linkedin.com/in/donghwan-kim-876b77207/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://orcid.org/0009-0000-4355-7608" target="_blank" rel="noopener">ORCID</a>
            <a href="mailto:{{ site.email }}">Email</a>
        </div>
        <button class="theme-toggle-btn" id="theme-toggle" type="button">Dark mode</button>
    </div>
</aside>
